# Local development database. Credentials here are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ebucard
      POSTGRES_PASSWORD: ebucard_dev
      POSTGRES_DB: ebucard
    ports:
      - "5432:5432"
    volumes:
      - ebucard_pg:/var/lib/postgresql/data
      # Creates the ebucard_test database used by `dart test`.
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  ebucard_pg:
