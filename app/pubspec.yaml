name: ebucard
description: "eBuCard – exchange e-business cards by NFC or QR code."
publish_to: 'none'
version: 0.8.0+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^16.0.0
  ebucard_models:
    path: ../packages/ebucard_models
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  flutter_contacts: ^2.6.0
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  ndef_record: ^1.5.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  # Design-system fonts (docs/design-system/ebucard/MASTER.md), Latin only;
  # Chinese uses the phone's system font. Licences: assets/fonts/OFL-*.txt.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
