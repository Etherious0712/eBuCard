name: ebucard
description: "eBuCard – exchange e-business cards by NFC or QR code."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^16.0.0
  ebucard_models:
    path: ../packages/ebucard_models
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0

  # Planned for later PRs (see docs/DESIGN.md §9):
  #   nfc_manager      – NFC reading on Android and iOS (Core NFC)
  #   mobile_scanner   – QR scanning
  #   qr_flutter       – QR rendering
  #   sign_in_with_apple, google_sign_in – social sign-in

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
