name: ebucard
description: "eBuCard – exchange e-business cards by NFC or QR code."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^16.0.0
  ebucard_models:
    path: ../packages/ebucard_models

  # Planned for the feature PRs (see docs/DESIGN.md §9); not added yet so the
  # scaffold carries no unused native plugins:
  #   nfc_manager      – NFC reading on Android and iOS (Core NFC)
  #   mobile_scanner   – QR scanning
  #   qr_flutter       – QR rendering
  #   drift / sqlite3  – local storage of own and received cards
  #   sign_in_with_apple, google_sign_in – social sign-in

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
