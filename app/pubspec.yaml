name: ebucard
description: "eBuCard – exchange e-business cards by NFC or QR code."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^16.0.0
  ebucard_models:
    path: ../packages/ebucard_models
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  flutter_contacts: ^2.6.0
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  ndef_record: ^1.5.0

  # Planned for later PRs (see docs/DESIGN.md §9):
  #   sign_in_with_apple, google_sign_in – social sign-in

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
